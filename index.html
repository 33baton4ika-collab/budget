<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Budget Dashboard</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Budget">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F4C3CF">
<link rel="manifest" href="manifest.webmanifest?v=2">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<link rel="icon" href="icon-192.png?v=2">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Inter+Tight:wght@800;900&family=Manrope:wght@400;500;700;800&family=Playfair+Display:ital,wght@1,400;1,600&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<style>
/* Layout: a paper collage on pink. Mac shows the whole month as one long page; a phone shows one section at a time with a bottom bar. One deliberate light look. */
:root{
  --ground:#F4C3CF; --paper:#FFF9F2; --receipt:#FFFDF9; --white:#FFFFFF;
  --blush:#F9D9E2; --plan:#F4B6C8; --rose:#E77FA0; --display:#D9638A;
  --deep:#C2185B; --deeper:#A0174E; --plum:#7A3B5E; --butter:#F7E3A3;
  --ink:#151214; --soft:#4A3B41; --muted:#6B5A60; --dot:#8C7A80; --line:#D8C3C9; --tan:#C9A27A; --clip:#9A8E92;
  --shadow:0 10px 26px rgba(122,32,64,.14); --shadow-lg:0 14px 28px rgba(122,32,64,.2);
  --f-display:'Inter Tight','Arial Black',sans-serif; --f-serif:'Playfair Display',Georgia,serif;
  --f-body:Manrope,system-ui,sans-serif; --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
body{background-color:var(--ground);background-image:radial-gradient(rgba(255,255,255,.45) 1.2px,transparent 1.6px);background-size:22px 22px;color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.4;overflow-x:clip}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
p,h1,h2,h3,ul{margin:0;padding:0}
ul{list-style:none}
:focus-visible{outline:2.5px solid var(--deeper);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
#wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 72px}
.inner{max-width:1360px;margin:0 auto}
@media (min-width:900px){.only-phone{display:none!important}}
@media (max-width:899.98px){.only-desk{display:none!important}}
#app{display:flex;flex-direction:column;gap:44px}
.view{display:flex;flex-direction:column;gap:24px}
#v-home{gap:20px}
@media (max-width:899.98px){.view:not(.active),#add:not(.active){display:none}#wrap{padding-block:18px 118px}#app{gap:0}}

/* headings */
.h{display:flex;align-items:center;flex-wrap:wrap;gap:4px 12px;line-height:1}
.h b{font-family:var(--f-display);font-weight:900;font-size:clamp(40px,5vw,60px);letter-spacing:-.06em}
.h em{display:inline-block;font-family:var(--f-serif);font-style:italic;font-weight:400;font-size:clamp(34px,4.4vw,54px);color:var(--plan);background:var(--ink);padding:0 14px 8px;transform:rotate(-2deg)}
.h b.boxed{background:var(--paper);padding:2px 16px 10px;box-shadow:6px 6px 0 var(--ink);transform:rotate(-1.5deg)}
.h em.plain{color:var(--deeper);background:none;padding:0;transform:none}
.card .h b{font-size:clamp(36px,4vw,50px)}.card .h em{font-size:clamp(32px,3.6vw,46px)}
.sec-top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.hint{font-family:var(--f-mono);font-size:13px;color:var(--soft)}

/* month tabs + add */
#top{display:flex;flex-wrap:wrap;align-items:flex-end;gap:6px;padding-left:12px}
#tabs{display:flex;flex-wrap:wrap;align-items:flex-end;gap:6px}
.tab{min-height:44px;padding:8px 16px;border:0;border-radius:12px 12px 0 0;background:var(--butter);box-shadow:inset 0 -8px 10px -8px rgba(122,32,64,.35);font-family:var(--f-display);font-weight:800;font-size:16px;letter-spacing:-.02em}
.tab small{font-family:var(--f-mono);font-weight:400;font-size:11px;color:var(--muted)}
.tab.on{min-height:54px;background:var(--paper);box-shadow:none}
.btn-ink{margin:0 0 8px auto;min-height:44px;padding:8px 22px 8px 16px;border:0;border-radius:999px;background:var(--ink);color:var(--paper);font-weight:800;display:inline-flex;align-items:center;gap:8px}
.btn-ink svg{stroke:var(--plan)}
.btn-line{min-height:44px;padding:8px 18px;border:1.5px solid var(--ink);border-radius:999px;background:var(--paper);font-weight:800;font-size:14px}
.btn-pop{min-height:44px;padding:8px 20px;border:0;border-radius:999px;background:var(--paper);box-shadow:4px 4px 0 var(--ink);font-weight:800;font-size:14px;display:inline-flex;align-items:center;gap:8px}

/* notice */
#notice:empty{display:none}
#notice{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.note{background:var(--paper);box-shadow:3px 3px 0 var(--ink);padding:8px 14px;border-radius:999px;font-size:13px;font-weight:700;border:0}
button.note{min-height:40px}

/* hero */
.hero{position:relative;display:flex;flex-wrap:wrap;gap:32px;align-items:center;justify-content:space-between;background:var(--paper);border-radius:0 8px 8px 8px;box-shadow:0 16px 40px rgba(122,32,64,.16);padding:44px clamp(20px,4vw,60px) 40px;overflow:hidden}
.hero-l{flex:1 1 520px;min-width:0;position:relative;padding-left:clamp(0px,3vw,40px)}
.eyebrow{margin-bottom:10px;font-family:var(--f-mono);font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.hero h1{line-height:.82}
.t1{display:block;font-family:var(--f-display);font-weight:900;font-size:clamp(76px,11vw,170px);letter-spacing:-.065em}
.t1.long{font-size:clamp(60px,8vw,124px)}
.t2{display:block;font-family:var(--f-serif);font-style:italic;font-weight:400;font-size:clamp(58px,8.4vw,130px);letter-spacing:-.02em;color:var(--display);margin:-.16em 0 0 clamp(40px,9vw,150px)}
.period{margin-top:22px;font-family:var(--f-mono);font-size:14px;color:var(--muted)}
.deco{position:absolute;pointer-events:none}
.polaroid{flex:0 1 360px;min-width:0;margin:0 auto;position:relative;background:var(--white);padding:16px 16px 20px;box-shadow:0 14px 30px rgba(122,32,64,.22);transform:rotate(2.5deg)}
.tape{position:absolute;width:130px;height:30px;top:-14px;left:50%;margin-left:-65px;transform:rotate(-5deg);background:repeating-linear-gradient(45deg,rgba(231,127,160,.6) 0 8px,rgba(255,255,255,.6) 8px 16px)}
.tape.y{background:repeating-linear-gradient(-45deg,rgba(247,227,163,.9) 0 7px,rgba(255,255,255,.7) 7px 14px)}
.pol-in{background:var(--blush);padding:26px 14px 22px;text-align:center}
.pol-l{font-family:var(--f-serif);font-style:italic;font-weight:600;font-size:27px;line-height:1.05;color:var(--deeper)}
.pol-n{margin:8px 0 6px;font-family:var(--f-serif);font-style:italic;font-weight:600;font-size:clamp(50px,6vw,70px);line-height:1;color:var(--deep);white-space:nowrap}
.pol-s{font-size:13px;line-height:1.4;color:var(--muted)}
.pol-c{margin-top:14px;text-align:center;font-size:14px;font-weight:600;line-height:1.35}
@media (max-width:899.98px){
  .hero{background:none;box-shadow:none;padding:0;overflow:visible;flex-direction:column;align-items:stretch;gap:14px;border-radius:0}
  .hero-l{flex:none;padding:0;display:flex;align-items:flex-end;justify-content:space-between;gap:8px}
  .t1,.t1.long{font-size:58px}.t2{font-size:42px;color:var(--deeper);margin:-6px 0 0 44px}
  .hero-side{flex:none;display:flex;align-items:center;gap:8px;margin-bottom:4px}
  .period{margin:0;padding:6px 10px;border-radius:999px;background:var(--paper);box-shadow:3px 3px 0 var(--ink);font-size:11.5px;white-space:nowrap}
  .polaroid{flex:none;width:100%;max-width:340px;padding:10px;transform:rotate(-1.5deg)}
  .pol-in{padding:14px 12px}.pol-l{font-size:22px}.pol-n{font-size:54px;margin:4px 0 2px}.pol-s{font-size:12px}
  .pol-c{margin-top:8px;font-size:13px}
}

/* key numbers */
.kpis{display:flex;flex-wrap:wrap;gap:16px}
.kpi{flex:1 1 280px;min-width:0;background:var(--paper);border-radius:8px;padding:22px;box-shadow:0 8px 22px rgba(122,32,64,.12);display:flex;gap:16px;align-items:flex-start}
.kpi svg{flex:none}
.big{font-family:var(--f-serif);font-style:italic;font-weight:600;font-size:40px;line-height:1;color:var(--deep)}
.kpi-l{margin-top:6px;font-family:var(--f-serif);font-style:italic;font-size:20px}
.kpi-s{margin-top:6px;font-size:13px;color:var(--muted)}
.mini{display:flex;gap:8px}
.mini>div{flex:1 1 0;min-width:0;background:var(--paper);border-radius:8px;padding:9px 10px}
.mono-l{font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.mini-n{margin-top:3px;font-family:var(--f-serif);font-style:italic;font-weight:600;font-size:21px;color:var(--deep)}

/* upcoming (phone) */
#upcoming{background:var(--receipt);padding:12px 14px 6px;box-shadow:var(--shadow);font-family:var(--f-mono)}
.up-top{display:flex;align-items:center;justify-content:space-between;padding-bottom:6px;border-bottom:1.5px dashed var(--ink)}
.label{display:inline-block;background:var(--ink);color:var(--paper);font-family:var(--f-display);font-weight:900;letter-spacing:-.05em;font-size:21px;padding:0 10px 4px;transform:rotate(-2deg)}
.up-sum{font-size:13px;font-weight:600;color:var(--deeper)}
.up{width:100%;min-height:44px;display:flex;align-items:center;gap:10px;padding:4px 2px;background:none;border:0;border-bottom:1px dashed var(--line);font-family:var(--f-mono);font-size:13.5px;text-align:left}
.up-box{flex:none;width:20px;height:20px;border:1.5px solid var(--ink);border-radius:5px;background:var(--white)}
.up-name{flex:1 1 auto;min-width:0;overflow-wrap:anywhere}
.up-name small{color:var(--muted);font-size:11px}
.pill{flex:none;display:inline-block;font-family:var(--f-body);font-size:10.5px;font-weight:800;border-radius:999px;padding:2px 8px;background:var(--blush);color:var(--deeper);white-space:nowrap}
.pill.y{background:var(--butter);color:var(--ink)}
.pill.hot{background:var(--deep);color:var(--receipt)}
.up-n{flex:none;width:52px;text-align:right;font-weight:600}
.empty{padding:14px 2px;font-family:var(--f-body);font-size:15px;color:var(--soft)}

/* charts */
.two{display:flex;flex-wrap:wrap;gap:24px;align-items:stretch}
.card{position:relative;flex:1 1 480px;min-width:0;background:var(--paper);border-radius:8px;padding:32px clamp(18px,3vw,36px);box-shadow:var(--shadow)}
.card-s{margin-top:12px;color:var(--muted)}
.seg{display:flex;gap:2px;height:60px;margin-top:22px;border-radius:10px;overflow:hidden}
.seg i{display:block;min-width:3px;box-shadow:inset 0 0 0 1px rgba(21,18,20,.12)}
.c-savings{background:var(--deep)}.c-debt{background:var(--ink)}.c-bills{background:var(--rose)}.c-musts{background:var(--plum)}.c-left{background:var(--butter)}
.leg{margin-top:22px;display:flex;flex-direction:column;gap:12px}
.leg li{display:flex;align-items:center;gap:12px}
.leg .sw{flex:none;width:18px;height:18px;border-radius:5px;box-shadow:inset 0 0 0 1px rgba(21,18,20,.3)}
.leg .n{flex:1 1 auto;min-width:0;font-weight:700}
.leg .n span{font-weight:500;color:var(--muted)}
.leg .a{font-family:var(--f-mono);font-size:14px;white-space:nowrap}
.leg .p{flex:none;width:58px;text-align:right;font-family:var(--f-serif);font-style:italic;font-weight:600;font-size:18px;color:var(--deep)}
.pf-leg{display:flex;gap:20px;margin-top:14px;font-size:14px;color:var(--muted)}
.pf-leg span{display:inline-flex;align-items:center;gap:8px}
.pf-leg i{width:16px;height:16px;border-radius:4px}
.s-plan{background:var(--plan);box-shadow:inset 0 0 0 1.5px var(--display)}.s-fact{background:var(--deep)}
.plot{position:relative;height:220px;margin:26px 0 0 40px;border-bottom:1.5px solid var(--ink)}
.gl{position:absolute;left:0;right:0;border-top:1px dashed var(--line)}
.gl span{position:absolute;left:-40px;top:-8px;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.bars{position:absolute;inset:0;display:flex;gap:4px}
.grp{flex:1 1 0;min-width:0;display:flex;align-items:flex-end;justify-content:center;gap:2px}
.bar{display:block;width:min(34px,44%);border-radius:4px 4px 0 0;min-height:0}
.xs{display:flex;gap:4px;margin:10px 0 0 40px}
.xs>div{flex:1 1 0;min-width:0;text-align:center}
.xs b{display:block;font-size:13.5px;font-weight:700}
.xs span{display:block;font-family:var(--f-mono);font-size:10.5px;color:var(--muted)}
.xs span.f{font-weight:600;color:var(--deeper)}
.after{margin-top:18px;font-family:var(--f-serif);font-style:italic;font-size:21px;color:var(--deeper)}

/* receipts */
.receipts{display:flex;flex-wrap:wrap;gap:32px;justify-content:center;align-items:flex-start;margin-top:12px}
.rc{flex:1 1 330px;min-width:0;max-width:420px;filter:drop-shadow(0 14px 18px rgba(122,32,64,.2))}
.rc:nth-child(1){transform:rotate(-1.2deg)}.rc:nth-child(2){transform:rotate(1deg);margin-top:24px}.rc:nth-child(3){transform:rotate(-.6deg);margin-top:8px}
.rc-top{position:relative;z-index:1;text-align:center;margin-bottom:-20px}
.rc-top .label{font-size:30px;padding:2px 16px 8px}
.paper{background:var(--receipt);padding:38px 22px 20px;font-family:var(--f-mono);font-size:13.5px}
.rc-sub{text-align:center;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.dash{border-top:1.5px dashed var(--ink);margin:12px 0 8px}
.cols{display:flex;gap:6px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding-bottom:2px}
.cols span:first-child{flex:1 1 auto;padding-left:30px}
.cols span+span{flex:none;width:56px;text-align:right}
.r{display:flex;align-items:center;gap:4px}
.r-check{flex:none;width:26px;min-height:36px;display:flex;align-items:center;justify-content:center;background:none;border:0;padding:0}
.r-main{flex:1 1 auto;min-width:0;min-height:36px;display:flex;align-items:center;gap:6px;background:none;border:0;padding:3px 0;font-family:var(--f-mono);font-size:13.5px;text-align:left}
.r-main:hover .r-name{text-decoration:underline;text-decoration-color:var(--rose);text-underline-offset:3px}
.r-name{min-width:0;overflow-wrap:anywhere;display:flex;flex-wrap:wrap;align-items:center;gap:2px 6px}
.dots{flex:1 1 auto;min-width:8px;border-bottom:1.5px dotted var(--dot);transform:translateY(-4px)}
.r-num{flex:none;width:56px;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.r-num.strong{color:var(--ink);font-weight:600}.r-num.over{color:var(--deep)}
.r-add{display:block;width:100%;min-height:36px;margin-top:4px;background:none;border:0;padding:0 0 0 30px;font-family:var(--f-mono);font-size:12px;color:var(--muted);text-align:left}
.r-add:hover{color:var(--deeper)}
.tot{display:flex;gap:6px;font-weight:600;font-size:15px}
.tot span:first-child{flex:1 1 auto}
.tot span+span{flex:none;width:56px;text-align:right;font-variant-numeric:tabular-nums}
.flag{margin-top:10px;display:flex;justify-content:space-between;gap:8px;background:var(--blush);padding:8px 10px;border-radius:4px;font-weight:600;color:var(--deeper)}
.flag.line{background:none;box-shadow:inset 0 0 0 1.5px var(--deep);margin-top:6px}
.code{height:40px;margin:18px 16px 0}
.code.a{background:repeating-linear-gradient(90deg,var(--ink) 0 2px,transparent 2px 4px,var(--ink) 4px 5px,transparent 5px 8px,var(--ink) 8px 11px,transparent 11px 13px,var(--ink) 13px 14px,transparent 14px 17px)}
.code.b{background:repeating-linear-gradient(90deg,var(--ink) 0 3px,transparent 3px 5px,var(--ink) 5px 6px,transparent 6px 9px,var(--ink) 9px 10px,transparent 10px 12px,var(--ink) 12px 15px,transparent 15px 17px)}
.code.c{background:repeating-linear-gradient(90deg,var(--ink) 0 1px,transparent 1px 3px,var(--ink) 3px 6px,transparent 6px 8px,var(--ink) 8px 9px,transparent 9px 12px,var(--ink) 12px 14px,transparent 14px 16px)}
.ty{margin-top:10px;font-size:10.5px;line-height:1.5;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-align:center;text-wrap:balance}
.ty svg{display:inline;margin-left:6px;vertical-align:-1px}.ty path{fill:var(--display)}
.zig{height:12px;background-image:linear-gradient(to bottom right,var(--receipt) 50%,transparent 50%),linear-gradient(to bottom left,var(--receipt) 50%,transparent 50%);background-size:14px 12px;background-repeat:repeat-x}

/* jars + wishlist */
.jars{display:flex;flex-wrap:wrap;gap:32px;align-items:flex-start;margin-top:12px}
#jarcards{display:contents}
.jar{position:relative;flex:1 1 280px;min-width:0;background:var(--white);padding:16px 16px 18px;box-shadow:var(--shadow-lg)}
.jar:nth-child(odd){transform:rotate(-1.5deg)}.jar:nth-child(even){transform:rotate(1.2deg);margin-top:18px}
.jar .tape{width:110px;height:28px;top:-13px;margin-left:-55px}
.jar-pic{position:relative;height:170px;background:var(--blush);display:flex;align-items:center;justify-content:center}
.jar-pic.y{background:var(--butter)}
.sticker{position:absolute;right:12px;bottom:12px;background:var(--ink);color:var(--paper);font-family:var(--f-mono);font-weight:600;font-size:14px;padding:4px 10px;transform:rotate(-3deg)}
.jar h3{margin-top:16px;font-family:var(--f-serif);font-style:italic;font-weight:400;font-size:32px;line-height:1.05;overflow-wrap:anywhere}
.jar-s{margin-top:8px;font-size:14px;color:var(--muted)}
.prog{margin-top:12px;height:14px;border-radius:999px;box-shadow:inset 0 0 0 1.5px var(--ink);overflow:hidden}
.prog i{display:block;height:100%;background:var(--deep)}
.prog.none{box-shadow:none;border:1.5px dashed var(--dot)}
.prog-l{margin-top:8px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 10px;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.jar-b{margin-top:12px;display:flex;flex-wrap:wrap;gap:8px}
.jar-b button{min-height:44px;padding:6px 14px;font-size:13px}
.wish{position:relative;flex:1 1 300px;min-width:0;background-color:var(--receipt);background-image:repeating-linear-gradient(180deg,transparent 0 35px,var(--ground) 35px 36px);padding:26px 18px 22px 50px;box-shadow:var(--shadow);transform:rotate(-.8deg)}
.wish-m{position:absolute;top:0;bottom:0;left:34px;border-left:2px solid var(--rose)}
.wish h3{font-family:var(--f-serif);font-style:italic;font-weight:400;font-size:38px;line-height:1}
.wish li{display:flex;align-items:center;gap:6px;min-height:36px;font-size:15px;font-weight:600;line-height:1.2}
.wish li.done .wn{text-decoration:line-through;color:var(--muted)}
.wn{flex:1 1 auto;min-width:0;overflow-wrap:anywhere}
.wb{flex:none;width:30px;height:36px;background:none;border:0;padding:0;display:flex;align-items:center;justify-content:center}
.wb.x{color:var(--muted);font-family:var(--f-mono);font-size:16px}
#wish-list{margin-top:12px}
#wish-form{margin-top:12px;display:flex;flex-wrap:wrap;gap:8px}
#wish-form input{flex:1 1 110px;min-width:0;min-height:44px;padding:0 12px;border:1.5px solid var(--ink);border-radius:10px;background:var(--white);font-size:16px}
#wish-form input#wish-price{flex:0 1 96px}
#wish-form button{flex:none}

/* history */
.hist-top{position:relative;flex:none}
.h-plot{position:relative;height:130px;margin:18px 0 0 40px;border-bottom:1.5px solid var(--ink)}
.h-bars{position:absolute;inset:0;display:flex;gap:4px}
.h-col{flex:1 1 0;min-width:0;display:flex;align-items:flex-end;justify-content:center}
.h-col i{display:block;width:min(30px,80%);border-radius:4px 4px 0 0;background:var(--deep)}

.chip{min-height:36px;padding:6px 13px;border-radius:999px;border:1.5px solid var(--ink);background:var(--paper);font-size:13px;font-weight:800}

#add-form{display:flex;gap:8px;align-items:center}

#add-send{flex:none;width:50px;height:50px;border-radius:50%;border:0;background:var(--deep);display:flex;align-items:center;justify-content:center}

@media (min-width:900px){

}

/* bottom bar */
.hist-btn{flex:none;width:44px;height:44px;padding:0;display:flex;align-items:center;justify-content:center;border:0;border-radius:50%;background:var(--paper);box-shadow:3px 3px 0 var(--ink);color:var(--ink)}
#bottom{position:fixed;left:0;right:0;bottom:0;z-index:15;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:center;justify-items:center;min-height:76px;padding:0 max(6px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(6px,env(safe-area-inset-left,0px));background:var(--paper);border-top:1.5px solid var(--ink)}

/* editor */

.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:700}
.f input,.f select{min-height:44px;padding:0 12px;border:1.5px solid var(--ink);border-radius:10px;background:var(--white);font-size:16px;font-weight:500}

.c{display:flex;align-items:center;gap:10px;min-height:36px;font-size:14px;font-weight:600}

/* receipts: what is left to pay comes first */
.due{margin:4px 0 12px;padding:12px 14px;background:var(--blush);border-radius:6px}
.due-l{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:var(--deeper)}
.due-n{margin-top:2px;font-family:var(--f-serif);font-style:italic;font-weight:600;font-size:42px;line-height:1.05;color:var(--deep)}
.due-bar{margin-top:8px;height:8px;border-radius:999px;background:var(--white);box-shadow:inset 0 0 0 1px var(--plan);overflow:hidden}
.due-bar i{display:block;height:100%;background:var(--deep)}
.due-s{margin-top:6px;font-size:12px;color:var(--muted)}
.r.paid .r-name{color:var(--muted);text-decoration:line-through}
.r.paid .r-num.strong{color:var(--muted);font-weight:400}

/* moving tab */
body:not(.mv) #v-moving,body.mv .view:not(#v-moving),body.mv #foot{display:none}
#v-moving{gap:22px;padding-top:24px}
.tab.mv-tab{background:var(--rose)}
.tab.mv-tab.on{background:var(--paper)}
.mv-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px;align-items:start}
.mv-grid>*{min-width:0}
#mv-hero{grid-column:1/-1}
.mv-top{position:relative;max-width:760px;margin:0 auto;background:var(--white);padding:16px 16px 18px;box-shadow:0 14px 30px rgba(122,32,64,.22)}
.mv-in{background:var(--blush);padding:28px 16px 24px;text-align:center}
.mv-l{font-family:var(--f-serif);font-style:italic;font-weight:600;font-size:30px;line-height:1.05;color:var(--deeper)}
.mv-n{margin:8px 0 6px;font-family:var(--f-serif);font-style:italic;font-weight:600;font-size:clamp(46px,9vw,104px);line-height:1;color:var(--deep);white-space:nowrap}
.mv-s{font-size:14px;color:var(--muted)}
.mv-after{margin-top:14px;text-align:center;font-weight:700;line-height:1.4}

#mv-spend button{flex:none;min-height:50px;padding:0 22px;border:0;border-radius:999px;background:var(--deep);color:var(--paper);font-weight:800}
#mv-spend-err{flex:1 1 100%;font-size:13px;font-weight:700;color:var(--deeper)}
#mv-spend-err:empty{display:none}
#mv-spends{grid-column:1/-1;width:100%;max-width:760px;margin:-10px auto 0;padding:6px 16px;background:var(--receipt);box-shadow:var(--shadow);font-family:var(--f-mono);font-size:13.5px}

.sp{display:flex;align-items:center;gap:8px;min-height:40px;border-bottom:1px dashed var(--line)}
.sp:last-child{border-bottom:0}
.sp-n{min-width:0;padding:4px 0;overflow-wrap:anywhere}
.sp-n small{display:block;font-size:11.5px;color:var(--muted)}
.sp .dots{min-width:6px}
.sp-d{flex:none;font-size:11.5px;color:var(--muted)}
.sp b{flex:none;font-weight:600}
.sp .lk-x{color:var(--muted)}
.mm{display:flex;align-items:baseline;gap:6px;padding:5px 0}
.mm .dots{transform:none}
.mm b{flex:none;font-weight:600;font-variant-numeric:tabular-nums}
.mm.sum{font-size:17px;font-weight:600;color:var(--deep)}
.lock{background:var(--ink);color:var(--paper);border-radius:8px;padding:24px 22px;box-shadow:var(--shadow-lg)}
.lock-h{display:flex;align-items:center;flex-wrap:wrap;gap:4px 10px}
.lock-h b{font-family:var(--f-display);font-weight:900;font-size:38px;letter-spacing:-.05em;line-height:1}
.lock-h em{font-family:var(--f-serif);font-size:24px;color:var(--plan)}
.lk{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px dashed rgba(255,249,242,.28)}
.lk-b{flex:none;width:28px;height:28px;padding:0;border:1.5px solid var(--paper);border-radius:6px;background:none;color:var(--paper);font-weight:800;line-height:1}
.lk-b.on{background:var(--paper);color:var(--ink)}
.lk-n{flex:1 1 auto;min-width:0;overflow-wrap:anywhere;font-weight:600}
.lk.paid .lk-n{text-decoration:line-through;color:var(--plan)}

.lk-u{flex:none;width:92px;text-align:right;font-family:var(--f-mono);font-size:12.5px;color:var(--plan)}
.lk-x{flex:none;width:26px;height:36px;padding:0;background:none;border:0;color:var(--plan);font-size:16px}
.lock-t{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 12px;margin-top:12px;font-family:var(--f-mono);font-weight:600;font-size:15px}
#mv-add,#mv-edit .row{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
#mv-add input{flex:1 1 120px;min-width:0;min-height:44px;padding:0 12px;border:0;border-radius:10px;background:var(--paper);color:var(--ink);font-size:16px}
#mv-add input#mv-add-eur{flex:0 1 80px}
#mv-add button{flex:none;min-height:44px;padding:0 16px;border:0;border-radius:999px;background:var(--plan);color:var(--ink);font-weight:800}
#mv-edit{grid-column:1/-1;background:var(--paper);border-radius:8px;padding:18px 22px;box-shadow:var(--shadow)}
#mv-edit .f{flex:1 1 180px;min-width:0}
#mv-edit .btn-line{align-self:flex-end}
@media (max-width:899.98px){.mv-grid{grid-template-columns:minmax(0,1fr);gap:22px}.mv-top{padding:10px 10px 14px}.mv-l{font-size:24px}.mv-in{padding:18px 10px}.lk{flex-wrap:wrap}.lk-n{flex:1 1 calc(100% - 36px)}.lk-e{margin-left:36px}.lk-u{flex:1 1 auto;width:auto}}

/* sign-in */
#login-form{display:flex;flex-direction:column;gap:12px;width:100%;max-width:340px}
.login-err{min-height:18px;font-size:13px;font-weight:700;color:var(--deeper)}

<div id="toast" role="status" aria-live="polite" hidden></div>
<div id="tip" aria-hidden="true" hidden></div>

<script>
const MONTHS_EN=['january','february','march','april','may','june','july','august','september','october','november','december'];
const MONTHS_RU=['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];
const MONTHS_GEN=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const MONTHS_PREP=['январе','феврале','марте','апреле','мае','июне','июле','августе','сентябре','октябре','ноябре','декабре'];
const CAT_LABEL={income:['income','доход'],debt:['debt','долг'],savings:['savings','копилка'],bills:['bills','счета'],musts:['must haves','разовые']};
const OUT=['debt','savings','bills','musts'];
const ALL=['income',...OUT];
const CHIPS=[['auto','auto','сам угадает'],['bills','bills','счета'],['musts','must haves','разовые'],['groceries','groceries','продукты'],['savings','savings','копилка'],['income','income','доход'],['debt','debt','долг']];
const SALARY=['зарплата','зп','работа','salary','paycheck'];
const ALIASES=[
  [['продукты','продукти','еда','groceries'],'groceries'],
  [['вайфай','вай фай','wifi','wi-fi','интернет'],'wi fi'],
  [['телефон','связь'],'phone'],
  [['налоги','налог','податки'],'taxes'],
  [['спотифай'],'spotify'],
  [['телеграм','телега'],'telegram'],
  [['айклауд','иклауд'],'icloud'],
  [['гугл драйв','гугл диск','драйв'],'google drive'],
  [['переезд'],'moving out'],
];

const state={status:'loading',months:{},settings:{},moving:null,autoView:false,sel:null,picked:false,view:'home',chip:'auto',ed:null,notice:''};
let db=null,creating=false,toastTimer=null;

const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const amt=n=>Number(n)||0;
const fmt=n=>{const v=Math.round(amt(n));return (v<0?'−':'')+Math.abs(v).toLocaleString('en-US');};
const pad=n=>String(n).padStart(2,'0');
const clone=o=>JSON.parse(JSON.stringify(o));
const uid=()=>Math.random().toString(36).slice(2,10);
const sum=(list,fn)=>(list||[]).reduce((s,i)=>s+fn(i),0);
const norm=s=>String(s).toLowerCase().replace(/ё/g,'е').replace(/\s+/g,' ').trim();
const parseNum=s=>{const v=parseFloat(String(s).replace(/[\s ]/g,'').replace(/,(?=\d{3}(\D|$))/g,'').replace(',','.'));return Number.isFinite(v)&&v>=0?v:null;};
const isPhone=()=>matchMedia('(max-width:899.98px)').matches;
/* interface language: English everywhere; set LANG to 'ru' to bring the Russian copy back. Names of expenses are never translated. */
const LANG='en';
const T=(en,ru)=>LANG==='en'?en:ru;
const Cap=s=>s[0].toUpperCase()+s.slice(1);
const catLabel=c=>T(...(CAT_LABEL[c]||['','']));
const notSaved=()=>T('Not saved. Check your connection and try again.','Не сохранилось. Проверь интернет и повтори.');
function applyLang(){
  document.documentElement.lang=T('en','ru');
  document.querySelectorAll('[data-en]').forEach(el=>{
    if(el.dataset.ru===undefined) el.dataset.ru=el.textContent;
    el.textContent=T(el.dataset.en,el.dataset.ru);
  });
  document.querySelectorAll('[data-en-ph]').forEach(el=>{
    if(el.dataset.ruPh===undefined) el.dataset.ruPh=el.placeholder;
    el.placeholder=T(el.dataset.enPh,el.dataset.ruPh);
    el.setAttribute('aria-label',el.placeholder);
  });
}

/* period: a budget month is a calendar month, funded by the salary that arrives at the end of the month before it.
   Salary comes on the last Tuesday or Thursday, so the next month opens on the earlier of those days. */
const keyOf=d=>d.getFullYear()+'-'+pad(d.getMonth()+1);
function lastWeekday(y,m,wd){
  const d=new Date(y,m+1,0);
  return d.getDate()-((d.getDay()-wd+7)%7);
}
const paydays=(y,m)=>[lastWeekday(y,m,2),lastWeekday(y,m,4)].sort((a,b)=>a-b);
const monthIdx=key=>Number(key.split('-')[1])-1;
const nextKey=key=>{let [y,m]=key.split('-').map(Number);m+=1;if(m>12){m=1;y+=1;}return y+'-'+pad(m);};
const prevKey=key=>{let [y,m]=key.split('-').map(Number);m-=1;if(m<1){m=12;y-=1;}return y+'-'+pad(m);};
function openKey(d=new Date()){
  const k=keyOf(d);
  return d.getDate()>=paydays(d.getFullYear(),d.getMonth())[0]?nextKey(k):k;
}
function currentKey(d=new Date()){
  const cal=keyOf(d),keys=Object.keys(state.months).sort();
  return keys.includes(cal)?cal:(keys.find(k=>k>cal)||openKey(d));
}
function periodOf(key){
  const [y,m]=key.split('-').map(Number);
  return {start:new Date(y,m-1,1),end:new Date(y,m,0)};
}
function nextPay(d=new Date()){
  let y=d.getFullYear(),m=d.getMonth(),days=paydays(y,m);
  if(d.getDate()>days[1]){m+=1;if(m>11){m=0;y+=1;}days=paydays(y,m);}
  return {days,month:m,year:y,opens:nextKey(y+'-'+pad(m+1))};
}

/* money: what is still expected per line, and the month's totals */
const pending=it=>it.done?0:Math.max(amt(it.plan)-amt(it.fact),0);
function summarize(m){
  const s={plan:{},fact:{},pend:{}};
  for(const k of ALL){
    s.plan[k]=sum(m[k],i=>amt(i.plan));
    s.fact[k]=sum(m[k],i=>amt(i.fact));
    s.pend[k]=sum(m[k],pending);
  }
  s.spent=s.fact.bills+s.fact.musts;
  s.onHand=s.fact.income-OUT.reduce((t,k)=>t+s.fact[k],0);
  s.incoming=s.pend.income;
  s.planned=OUT.reduce((t,k)=>t+s.pend[k],0);
  s.free=s.onHand+s.incoming-s.planned;
  s.unplanned=sum(m.musts,i=>amt(i.plan)===0?amt(i.fact):0);
  return s;
}

/* quick add: "теннис 525", "+7500 ноут", "такси 1.5к" */
function parseEntry(text,exact){
  const eurRe=/€|(^|\s)(eur|евро)(?=\s|$)/gi;
  const isEur=/€|(^|\s)(eur|евро)(?=\s|$)/i.test(text);
  const t=String(text).replace(/₴|грн\.?|uah/gi,' ').replace(eurRe,' ').trim();
  if(!t) return null;
  const re=/(^|\s)(\+?)(\d{1,3}(?:[  ]\d{3})+|\d+(?:[.,]\d+)?)(\s?(?:к|k|тыс|тис)\.?)?(?=\s|$)/gi;
  let hit=null,mt;
  while((mt=re.exec(t))) hit=mt;
  if(!hit) return {error:T('No amount found. Try: coffee 85','Не вижу сумму. Напиши так: теннис 525')};
  let raw=hit[3].replace(/[  ]/g,'');
  raw=/^\d+[.,]\d{3}$/.test(raw)?raw.replace(/[.,]/,''):raw.replace(',','.');
  let amount=parseFloat(raw);
  if(hit[4]) amount*=1000;
  let eur=0,eurRate=0;
  if(isEur){
    eurRate=amt(state.moving&&state.moving.rate);
    if(!eurRate) return {error:T('Add the euro rate on the moving tab first','Сначала укажи курс евро на вкладке moving')};
    eur=amount;
    amount=Math.round(amount*eurRate*100)/100;
  }else amount=exact?Math.round(amount*100)/100:Math.round(amount);
  const from=hit.index+hit[1].length;
  const name=(t.slice(0,from)+' '+t.slice(hit.index+hit[0].length)).replace(/\s+/g,' ').replace(/^[\s,.:—-]+|[\s,.:—-]+$/g,'');
  if(!amount) return {error:T('The amount must be above zero','Сумма должна быть больше нуля')};
  if(!name) return {error:T('Add what it was for, e.g. coffee 85','Напиши ещё, на что это. Например: теннис 525')};
  return {name,amount,plus:hit[2]==='+',eur,rate:eurRate};
}
function findItem(m,name,cats){
  const n=norm(name);
  if(cats.includes('income')&&SALARY.includes(n)){
    const pay=(m.income||[]).find(i=>i.repeat)||(m.income||[])[0];
    if(pay) return {cat:'income',it:pay};
  }
  const alias=ALIASES.find(([a])=>a.includes(n));
  const target=alias?alias[1]:n;
  for(const c of cats) for(const it of m[c]||[]) if(norm(it.name)===target) return {cat:c,it};
  for(const c of cats) for(const it of m[c]||[]){
    const nn=norm(it.name);
    if((target.length>=4&&nn.includes(target))||(nn.length>=4&&target.includes(nn))) return {cat:c,it};
  }
  return null;
}
function applyEntry(m,p,chip){
  let found=null,cat;
  if(chip==='income'||(chip==='auto'&&p.plus)){cat='income';found=findItem(m,p.name,['income']);}
  else if(chip==='groceries'){cat='bills';found=findItem(m,'продукты',['bills']);}
  else if(chip==='auto'){found=findItem(m,p.name,['bills','musts','savings','debt']);cat=found?found.cat:'musts';}
  else{cat=chip;found=findItem(m,p.name,[chip]);}
  let it=found&&found.it,created=false;
  if(!it){
    it={id:uid(),name:chip==='groceries'?'Groceries':p.name,plan:0,fact:null,done:false,repeat:false};
    (m[cat]=m[cat]||[]).push(it);
    created=true;
  }
  const doneBefore=!!it.done;
  it.fact=amt(it.fact)+p.amount;
  if(!it.rolling&&it.fact>=amt(it.plan)) it.done=true;
  return {cat,it,created,doneBefore};
}

/* new month: copies every line marked "repeat" from the latest month */
function newMonthFrom(prev,key){
  const copy=list=>(list||[]).filter(i=>i.repeat).map(i=>{
    const o={id:i.id,name:i.name,plan:amt(i.plan),fact:null,done:false,repeat:true};
    if(i.rolling) o.rolling=true;
    if(i.due) o.due=i.due;
    return o;
  });
  const doc={createdAt:new Date().toISOString(),log:[]};
  for(const k of ALL) doc[k]=copy(prev[k]);
  return doc;
}

/* store */
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function write(fn){
  try{return await fn();}
  catch(e){if(e&&e.code==='unavailable'){await sleep(400+Math.random()*600);return fn();}throw e;}
}
const cur=()=>state.months[state.sel];
async function saveMonth(m,key=state.sel){
  const {key:_k,...body}=m;
  state.months[key]={key,...body};
  render();
  try{await write(()=>db.doc('months/'+key).set(body));}
  catch(e){toast(notSaved());}
}
async function saveSettings(){
  render();
  try{await write(()=>db.doc('settings/main').set(state.settings));}
  catch(e){toast(notSaved());}
}
async function ensureCurrent(){
  if(!db||creating||state.status!=='ready') return;
  const key=openKey();
  if(!state.months[key]){
    const prev=Object.keys(state.months).sort().filter(k=>k<key).pop();
    if(!prev) return;
    creating=true;
    try{
      const ref=db.doc('months/'+key);
      const snap=await ref.get();
      if(!snap.exists){
        await write(()=>ref.set(newMonthFrom(state.months[prev],key)));
        state.notice=T(Cap(MONTHS_EN[monthIdx(key)])+' is open: the new salary goes there',Cap(MONTHS_RU[monthIdx(key)])+' открыт: сюда пойдёт новая зарплата');
      }
      state.months[key]=state.months[key]||{key,...newMonthFrom(state.months[prev],key)};
    }catch(e){toast(T('Could not open the new month.','Не получилось открыть новый месяц.'));}
    creating=false;
  }
  if(!state.picked&&state.sel!==currentKey()) state.sel=currentKey();
  render();
}
function start(){
  let gotMonths=false,gotSettings=false,gotMoving=false;
  const ready=()=>{
    if(!gotMonths||!gotSettings||!gotMoving) return;
    const keys=Object.keys(state.months).sort();
    state.status=keys.length?'ready':'empty';
    if(!state.sel||!state.months[state.sel]) state.sel=keys.length?currentKey():null;
    if(state.moving&&!state.autoView){state.autoView=true;setView('moving');}
    if(!state.moving&&state.view==='moving') setView('home');
    render();
    ensureCurrent();
  };
  db.collection('months').onSnapshot(snap=>{
    const next={};
    snap.docs.forEach(d=>{next[d.id]={key:d.id,...d.data()};});
    state.months=next;
    if(!snap.metadata.fromCache) gotMonths=true;
    ready();
  },()=>{state.status='nodb';render();});
  db.doc('settings/main').onSnapshot(snap=>{
    state.settings=snap.exists?clone(snap.data()):{};
    if(!snap.metadata.fromCache) gotSettings=true;
    ready();
  },()=>{state.status='nodb';render();});
  db.doc('settings/moving').onSnapshot(snap=>{
    state.moving=snap.exists?clone(snap.data()):null;
    if(!snap.metadata.fromCache) gotMoving=true;
    ready();
  },()=>{gotMoving=true;ready();});
}

/* rendering */
const ICON={
  sparkle:(c,w)=>`<svg width="${w}" height="${w}" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1C12.8 8 16 11.2 23 12C16 12.8 12.8 16 12 23C11.2 16 8 12.8 1 12C8 11.2 11.2 8 12 1Z" style="fill:var(${c});stroke:var(--tan)" stroke-width=".8"></path></svg>`,
  heart:`M12 21C5 15.5 1 12 1 7C1 3.7 3.6 1 6.8 1C9 1 10.9 2.2 12 4C13.1 2.2 15 1 17.2 1C20.4 1 23 3.7 23 7C23 12 19 15.5 12 21Z`,
};
const kpiIcon=p=>`<svg aria-hidden="true" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const smallHeart=`<svg aria-hidden="true" width="12" height="11" viewBox="0 0 24 22"><path d="${ICON.heart}"></path></svg>`;
const box=done=>done
  ?`<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect x="1" y="1" width="14" height="14" rx="3" style="fill:var(--deep)"></rect><path d="M4.5 8.2L7 10.5L11.5 5.5" fill="none" style="stroke:var(--receipt)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>`
  :`<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="1.5" width="13" height="13" rx="3" fill="none" style="stroke:var(--ink)" stroke-width="1.5"></rect></svg>`;

function renderTabs(){
  const mv=state.view==='moving';
  $('tabs').innerHTML=Object.keys(state.months).sort().map(k=>{
    const on=!mv&&k===state.sel;
    return `<button type="button" class="tab${on?' on':''}" aria-pressed="${on}" data-act="pick" data-key="${k}">${MONTHS_EN[monthIdx(k)].slice(0,3)} <small>${k.slice(2,4)}</small></button>`;
  }).join('')+(state.moving?`<button type="button" class="tab mv-tab${mv?' on':''}" aria-pressed="${mv}" data-act="view" data-view="moving">moving</button>`:'');
  $('nav-moving').hidden=!state.moving;
  $('nav-history').hidden=!!state.moving;
}
function renderHero(m,s,key){
  const now=currentKey();
  const isCur=key===now,isNext=key>now;
  const {start:b,end:e}=periodOf(key);
  const name=MONTHS_EN[e.getMonth()];
  const neg=s.free<0;
  const mon=Cap(name),day=e.getDate();
  const label=isCur?(neg?T('short by','не хватает'):T('safe to spend','можно ещё потратить')):isNext?(neg?T('will be short by','не будет хватать'):T('available','можно будет потратить')):(neg?T('ended short by','не хватило'):T('left at month end','осталось к концу месяца'));
  const sub=isCur?T(`until ${mon} ${day}, after everything still planned is paid`,`до ${day} ${MONTHS_GEN[e.getMonth()]} — если оплатить всё, что ещё запланировано`):isNext?T(`in ${mon}, after everything planned is paid`,`в ${MONTHS_PREP[e.getMonth()]} — если оплатить всё, что запланировано`):T('if everything planned was paid','если всё запланированное было оплачено');
  const calc=T(`on hand ${fmt(s.onHand)}${s.incoming?' + incoming '+fmt(s.incoming):''} − planned ${fmt(s.planned)}`,`на руках ${fmt(s.onHand)}${s.incoming?' + придёт '+fmt(s.incoming):''} − в планах ${fmt(s.planned)}`);

function niceTop(max){
  if(max<=0) return {top:0,step:0};
  const pow=Math.pow(10,Math.floor(Math.log10(max)));
  let step=pow*10;
  for(const c of [1,2,2.5,5,10]) if(max/(c*pow)<=3){step=c*pow;break;}
  return {top:Math.ceil(max/step)*step,step};
}
const kLabel=v=>v>=1000?(v/1000)+'k':String(v);
function gridLines(top,step){
  let html='';
  for(let v=step;v<=top;v+=step) html+=`<div class="gl" style="bottom:${v/top*100}%" aria-hidden="true"><span>${kLabel(v)}</span></div>`;
  return html;
}

/* moving tab: savings are held in euro, so only the euro left after the locked amounts is converted.
   Left to live on = free euro × rate + money on the account − unpaid bills − what was spent after the plan was made.
   Groceries stay out of unpaid bills: they are paid from this money and count once spent. */
const fmt2=n=>{const v=Number(n)||0;return (v<0?'−':'')+Math.abs(v).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});};
const round2=n=>Math.round((Number(n)+Number.EPSILON)*100)/100;
function movingCalc(mv){
  const m=state.months[mv.month];
  const spentNow=m?sum(m.debt,i=>amt(i.fact))+sum(m.bills,i=>amt(i.fact))+sum(m.musts,i=>amt(i.fact)):0;
  const spent=round2(Math.max(spentNow-amt(mv.baseline),0)+sum(mv.spends,s=>amt(s.amount)));
  const res=mv.reserves||[];
  const eur=round2(sum(res,r=>amt(r.eur)));
  const locked=round2(eur*amt(mv.rate));
  const freeEur=round2(amt(mv.savedEur)-eur);
  const freeUah=round2(freeEur*amt(mv.rate));
  const open=m?[...(m.bills||[]).filter(i=>!i.rolling),...(m.musts||[]),...(m.debt||[])].filter(i=>pending(i)>0):[];
  const bills=round2(sum(open,pending));
  const left=round2(freeUah+amt(mv.extra)-bills-spent);
  return {spent,eur,locked,freeEur,freeUah,left,bills,billCount:open.length};
}

    <button type="button" class="lk-b${r.paid?' on':''}" data-act="mv-paid" data-id="${esc(r.id)}" aria-pressed="${!!r.paid}" aria-label="${r.paid?'Unmark':'Mark as paid'}: ${esc(r.name)}">${r.paid?'✓':''}</button>

  setVal('mv-saved',amt(mv.savedEur));

function setView(v){

function toast(text,undo){
  const t=$('toast');
  t.innerHTML=`<span>${esc(text)}</span>${undo?`<button type="button" id="toast-undo">${T('undo','вернуть')}</button>`:''}`;
  t.hidden=false;
  if(undo) $('toast-undo').onclick=()=>{t.hidden=true;undo();};
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>{t.hidden=true;},undo?6000:4000);
}
function toggle(cat,id){
  const before=cur();
  const m=clone(before);
  const it=(m[cat]||[]).find(i=>i.id===id);
  if(!it) return;
  if(!it.done){
    if(!amt(it.fact)) it.fact=amt(it.plan);
    it.done=true;
    saveMonth(m);
    toast(T('Marked: ','Отмечено: ')+it.name,()=>saveMonth(clone(before)));
  }else{
    it.done=false;
    if(amt(it.fact)===amt(it.plan)) it.fact=null;
    saveMonth(m);
  }
}
function openEditor(cat,id){
  const it=id?(cur()[cat]||[]).find(i=>i.id===id):null;
  state.ed={cat,id:it?it.id:null,sure:false};
  const j=it&&(state.settings.jars||{})[it.id]||{};
  $('ed-title').textContent=it?it.name:T('new row','новая строка');
  $('ed-name').value=it?it.name:'';
  $('ed-plan').value=it&&amt(it.plan)?it.plan:'';
  $('ed-fact').value=it&&it.fact!=null?it.fact:'';
  $('ed-cat').value=cat;
  $('ed-due').value=it&&it.due||'';
  $('ed-goal').value=j.goal||'';
  $('ed-start').value=j.start||'';
  $('ed-done').checked=!!(it&&it.done);
  $('ed-repeat').checked=it?!!it.repeat:cat!=='musts'&&cat!=='income';
  $('ed-rolling').checked=!!(it&&it.rolling);
  $('ed-jar').hidden=cat!=='savings';
  $('ed-del').hidden=!it;
  $('ed-del').textContent=T('delete','удалить');
  $('editor').showModal();
}
function saveEditor(){
  const {cat,id}=state.ed;
  const name=$('ed-name').value.trim();
  if(!name) return;
  const target=$('ed-cat').value;
  const m=clone(cur());
  let it=id?(m[cat]||[]).find(i=>i.id===id):null;
  if(it&&target!==cat){m[cat]=m[cat].filter(i=>i!==it);(m[target]=m[target]||[]).push(it);}
  if(!it){it={id:uid()};(m[target]=m[target]||[]).push(it);}
  const fact=$('ed-fact').value.trim();
  it.name=name;
  it.plan=parseNum($('ed-plan').value)||0;
  it.fact=fact===''?null:parseNum(fact);
  it.done=$('ed-done').checked;
  it.repeat=$('ed-repeat').checked;
  const due=parseInt($('ed-due').value,10);
  if(due>=1&&due<=31) it.due=due; else delete it.due;
  if($('ed-rolling').checked) it.rolling=true; else delete it.rolling;
  if(target==='savings'){
    const goal=parseNum($('ed-goal').value)||0,start=parseNum($('ed-start').value)||0;
    state.settings.jars={...(state.settings.jars||{}),[it.id]:{goal,start}};
    saveSettings();
  }
  $('editor').close();
  saveMonth(m);
}
function deleteEdited(){
  if(!state.ed.sure){state.ed.sure=true;$('ed-del').textContent=T('really delete?','точно удалить?');return;}
  const {cat,id}=state.ed;
  const before=cur();
  const m=clone(before);
  m[cat]=(m[cat]||[]).filter(i=>i.id!==id);
  $('editor').close();
  saveMonth(m);
  toast(T('Row deleted','Строка удалена'),()=>saveMonth(clone(before)));
}
function undoEntry(id){
  const m=clone(cur());
  const e=(m.log||[]).find(x=>x.id===id);
  if(!e) return;
  const u=e.undo,list=m[u.cat]||[],it=list.find(i=>i.id===u.itemId);
  if(it){
    if(u.created) m[u.cat]=list.filter(i=>i!==it);
    else{const f=amt(it.fact)-u.delta;it.fact=f>0?f:null;it.done=u.doneBefore;}
  }
  m.log=m.log.filter(x=>x!==e);
  saveMonth(m);
}
/* salary typed while the old month is still on screen belongs to the month it pays for */
function incomeTarget(p){
  if(!(state.chip==='income'||(state.chip==='auto'&&p.plus))) return state.sel;
  const nk=nextKey(state.sel),nm=state.months[nk];
  if(!nm) return state.sel;
  const here=findItem(cur(),p.name,['income']),there=findItem(nm,p.name,['income']);
  return here&&here.it.done&&there&&!there.it.done?nk:state.sel;
}
function submitEntry(){
  const input=$('add-entry'),err=$('add-err');
  err.textContent='';
  const text=input.value.trim();
  const p=parseEntry(text);
  if(!p) return;
  if(p.error){err.textContent=p.error;return;}
  const key=incomeTarget(p);
  const m=clone(state.months[key]);
  const planBefore=r=>amt(r.it.plan);
  const r=applyEntry(m,p,state.chip);
  const s=summarize(m);
  m.log=(m.log||[]).concat({
    id:uid(),at:new Date().toISOString(),text,cat:r.cat,name:r.it.name,amount:p.amount,free:s.free,
    extra:planBefore(r)===0&&r.cat!=='income',
    planWas:r.cat==='income'&&planBefore(r)&&planBefore(r)!==amt(r.it.fact)?planBefore(r):0,
    undo:{cat:r.cat,itemId:r.it.id,delta:p.amount,created:r.created,doneBefore:r.doneBefore},
  }).slice(-60);
  input.value='';
  state.chip='auto';
  saveMonth(m,key);
  if(key!==state.sel) toast(T(`Saved to ${Cap(MONTHS_EN[monthIdx(key)])}: `,`Записано в ${MONTHS_RU[monthIdx(key)]}: `)+`${r.it.name} — ${fmt(p.amount)} ₴`);
  input.focus();
}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');

  const {act,cat,id,key,view}=b.dataset;
  if(act==='pick'){state.sel=key;state.picked=key!==currentKey();state.notice='';render();if(state.view==='moving'||(isPhone()&&state.view==='history'))setView('home');}
  else if(act==='mv-paid'){
    const r=(state.moving.reserves||[]).find(x=>x.id===id);
    if(r){r.paid=!r.paid;saveMoving();}
  }
  else if(act==='mv-del'){
    const before=clone(state.moving);
    const r=(state.moving.reserves||[]).find(x=>x.id===id);
    state.moving.reserves=(state.moving.reserves||[]).filter(x=>x.id!==id);
    saveMoving();
    if(r) toast('Removed: '+r.name,()=>{state.moving=before;saveMoving();});
  }
  else if(act==='mv-unspend'){
    const before=clone(state.moving);
    const s=(state.moving.spends||[]).find(x=>x.id===id);
    state.moving.spends=(state.moving.spends||[]).filter(x=>x.id!==id);
    saveMoving();
    if(s) toast('Removed: '+s.name,()=>{state.moving=before;saveMoving();});
  }
  else if(act==='view'){if(view==='add'&&state.view==='moving') focusSpend();else setView(view);}
  else if(act==='open-add'){if(state.view==='moving') focusSpend();else setAdd(true);}
  else if(act==='close-add') setAdd(false);
  else if(act==='toggle') toggle(cat,id);
  else if(act==='edit') openEditor(cat,id);
  else if(act==='new') openEditor(cat,null);
  else if(act==='undo') undoEntry(id);
  else if(act==='chip'){state.chip=key;renderAdd(cur());}
  else if(act==='sign-out'){firebase.auth().signOut().then(()=>location.reload());}
  else if(act==='ed-close') $('editor').close();
  else if(act==='ed-del') deleteEdited();
  else if(act==='first-month'){
    const k=currentKey(),doc={createdAt:new Date().toISOString(),log:[],income:[],debt:[],savings:[],bills:[],musts:[]};
    state.months[k]={key:k,...doc};state.sel=k;state.status='ready';render();
    write(()=>db.doc('months/'+k).set(doc)).catch(()=>toast(notSaved()));
  }
  else if(act==='wish-toggle'){
    state.settings.wishlist=(state.settings.wishlist||[]).map(w=>w.id===id?{...w,done:!w.done}:w);saveSettings();
  }
  else if(act==='wish-del'){
    state.settings.wishlist=(state.settings.wishlist||[]).filter(w=>w.id!==id);saveSettings();
  }
});
$('add-form').addEventListener('submit',e=>{e.preventDefault();submitEntry();});
$('ed-form').addEventListener('submit',e=>{e.preventDefault();saveEditor();});
$('ed-cat').addEventListener('change',e=>{$('ed-jar').hidden=e.target.value!=='savings';});
$('wish-form').addEventListener('submit',e=>{
  e.preventDefault();
  const name=$('wish-name').value.trim();
  if(!name) return;
  state.settings.wishlist=(state.settings.wishlist||[]).concat({id:uid(),name,price:parseNum($('wish-price').value)||0,done:false});
  $('wish-name').value='';$('wish-price').value='';
  saveSettings();
});
document.addEventListener('change',e=>{
  const id=e.target.dataset&&e.target.dataset.mvEur;
  if(!id||!state.moving) return;
  const r=(state.moving.reserves||[]).find(x=>x.id===id),v=parseNum(e.target.value);
  if(r&&v!==null){r.eur=v;saveMoving();}else render();
});
$('mv-spend').addEventListener('submit',e=>{
  e.preventDefault();
  const input=$('mv-spend-in'),err=$('mv-spend-err');
  err.textContent='';
  const p=parseEntry(input.value,true);
  if(!p) return;
  if(p.error){err.textContent=p.error;return;}
  if(p.plus){err.textContent='Only spending goes here. Write it without the plus.';return;}
  const entry={id:uid(),at:new Date().toISOString(),name:p.name,amount:p.amount};
  if(p.eur){entry.eur=p.eur;entry.rate=p.rate;}
  state.moving.spends=(state.moving.spends||[]).concat(entry);
  input.value='';
  saveMoving();
  input.focus();
});
$('mv-add').addEventListener('submit',e=>{
  e.preventDefault();
  const name=$('mv-add-name').value.trim(),eur=parseNum($('mv-add-eur').value);
  if(!name||!eur) return;
  state.moving.reserves=(state.moving.reserves||[]).concat({id:uid(),name,eur,paid:false});
  $('mv-add-name').value='';$('mv-add-eur').value='';
  saveMoving();
});
$('mv-edit').addEventListener('submit',e=>{
  e.preventDefault();
  const saved=parseNum($('mv-saved').value),rate=parseNum($('mv-rate').value),extra=parseNum($('mv-extra').value||'0');
  if(saved===null||extra===null||!rate){toast('Check the numbers: use digits only, for example 51.27');return;}
  const d=new Date();
  state.moving.savedEur=saved;
  state.moving.extra=extra;
  if(rate!==amt(state.moving.rate)){state.moving.rate=rate;state.moving.rateDate=keyOf(d)+'-'+pad(d.getDate());}
  saveMoving();
  toast('Updated');
});
document.addEventListener('visibilitychange',()=>{if(!document.hidden) ensureCurrent();});
const tip=$('tip');
document.addEventListener('pointermove',e=>{
  const t=e.target.closest&&e.target.closest('[data-tip]');
  if(!t||e.pointerType==='touch'){tip.hidden=true;return;}
  tip.textContent=t.dataset.tip;
  tip.hidden=false;
  tip.style.left=Math.min(e.clientX+14,innerWidth-tip.offsetWidth-8)+'px';
  tip.style.top=Math.max(e.clientY-tip.offsetHeight-10,8)+'px';
});

/* sign-in: the database rules let only this account read or write anything */
document.addEventListener('submit',async e=>{
  if(e.target.id!=='login-form') return;
  e.preventDefault();
  const err=$('login-err');
  err.textContent='';
  try{await firebase.auth().signInWithEmailAndPassword($('login-email').value.trim(),$('login-pass').value);}
  catch(x){err.textContent=x&&x.code==='auth/network-request-failed'?'No connection. Check your internet and try again.':'Wrong email or password.';}
});
async function importData(file){
  const data=JSON.parse(await file.text());
  const batch=db.batch();
  Object.entries(data.months||{}).forEach(([k,v])=>batch.set(db.doc('months/'+k),v));
  Object.entries(data.settings||{}).forEach(([k,v])=>batch.set(db.doc('settings/'+k),v));
  await batch.commit();
}
document.addEventListener('change',e=>{
  if(e.target.id!=='import-file'||!e.target.files[0]) return;
  importData(e.target.files[0]).catch(()=>{$('import-err').textContent='This file could not be imported.';});
});
function boot(){
  if(!window.firebase){state.status='nodb';render();return;}
  if(!window.FIREBASE_CONFIG){state.status='setup';render();return;}
  firebase.initializeApp(window.FIREBASE_CONFIG);
  firebase.auth().onAuthStateChanged(user=>{
    if(!user){state.status='login';render();return;}
    if(db) return;
    state.status='loading';
    render();
    db=firebase.firestore();
    start();
  });
}
applyLang();
setView('home');
render();
boot();
</script>

</body>
</html>
